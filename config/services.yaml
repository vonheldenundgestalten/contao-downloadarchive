services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            $filesStorage: '@contao.filesystem.virtual.files'

    VHUG\DownloadarchiveBundle\:
        resource: ../src/
        exclude:
            - ../src/ContaoManager/
            - ../src/VhugDownloadarchiveBundle.php
            - ../src/Model/

    VHUG\DownloadarchiveBundle\Controller\:
        resource: ../src/Controller/
        public: true
        tags:
            - controller.service_arguments
